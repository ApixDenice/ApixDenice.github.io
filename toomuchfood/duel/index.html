<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- CSP (GitHub Pages can't send headers): only this site's own files, no network calls. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<!-- The duel token is in the URL: never pass it on to other sites. -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel · Too Much Food</title>
<meta name="description" content="You've been challenged. Watch the run, then race your friend's ghost on the same course in Too Much Food.">
<meta property="og:title" content="You've been challenged in Too Much Food 👻🍟">
<meta property="og:description" content="Same course. Their ghost. Beat their score.">
<meta name="apple-itunes-app" content="app-id=6749512460">
<style>
  :root { --ink:#281E16; --gold:#FFC93C; --cream:#FFF6E6; --green:#5FBE4A; --green-edge:#3E8C2E; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family: "Avenir Next", -apple-system, system-ui, sans-serif;
    color:#fff; text-align:center;
    background: linear-gradient(180deg, #FF9E3D 0%, #D93D6B 100%) fixed;
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width:100%; max-width:420px; }
  .brand { font-weight:900; letter-spacing:.04em; font-size:22px; opacity:.95; margin:0 0 20px; }
  .brand b { color:var(--gold); }
  .kicker { font-weight:900; font-size:52px; line-height:1; margin:0; color:var(--gold);
            text-shadow:0 4px 0 rgba(0,0,0,.25); }
  .who { font-weight:800; font-size:20px; margin:14px 0 20px; text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .score { font-weight:900; font-size:96px; line-height:1; margin:0; text-shadow:0 6px 0 rgba(0,0,0,.25); }
  .sub { font-weight:700; font-size:14px; letter-spacing:.06em; opacity:.85; margin:8px 0 28px; }
  .btn { display:block; width:100%; padding:18px 20px; margin:0 0 14px; border-radius:30px;
         font-weight:900; font-size:21px; text-decoration:none; }
  .primary { background:var(--green); color:#fff; box-shadow:0 6px 0 var(--green-edge); }
  .secondary { background:rgba(255,255,255,.18); color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18); }
  /* Most people opening a duel link do not have the game. The install was a
     grey afterthought under a green button that does nothing for them. */
  .install { background:#FFC93C; color:#2B1B10; box-shadow:0 6px 0 #C79512; }
  .btn:active { transform:translateY(4px); box-shadow:none; }
  .help { font-size:14px; line-height:1.45; opacity:.9; margin:22px 4px 0; }

  /* Ghost replay. Hidden until a run has actually been decoded from the link,
     so a malformed or old-format link simply shows the page it always did. */
  .replay { display:none; margin:0 0 22px; }
  .replay.on { display:block; }
  .stage { position:relative; width:100%; border-radius:20px; overflow:hidden;
           box-shadow:0 8px 0 rgba(0,0,0,.18); background:#8FD0F5; }
  .stage canvas { display:block; width:100%; height:200px; }
  .tag { position:absolute; top:10px; left:12px; font-size:11px; font-weight:800;
         letter-spacing:.10em; opacity:.85; text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .live { position:absolute; top:8px; right:12px; font-size:26px; font-weight:900;
          text-shadow:0 2px 0 rgba(0,0,0,.28); }
  .seek { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(0,0,0,.18); }
  .seek i { display:block; height:100%; width:0; background:var(--gold); }
  .lang { position:fixed; top:max(12px, env(safe-area-inset-top)); right:12px; display:inline-flex; border-radius:999px; overflow:hidden; background:rgba(0,0,0,.16); }
  .lang button { border:0; background:none; color:#fff; font:800 12px/1 inherit; font-family:inherit; padding:8px 11px; cursor:pointer; opacity:.8; }
  .lang button.on { background:#fff; color:#2B1B10; opacity:1; }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Sprache / Language"><button type="button" data-l="de">DE</button><button type="button" data-l="en">EN</button></div>
<main>
  <p class="brand">TOO MUCH <b>FOOD</b></p>
  <p class="kicker" data-t="kicker">DUEL!</p>
  <p class="who" id="who" data-t="whoGeneric">A friend challenges you</p>

  <div class="replay" id="replay">
    <div class="stage">
      <canvas id="canvas" width="800" height="400"></canvas>
      <div class="tag" id="tag" data-t="tagGeneric">THEIR RUN</div>
      <div class="live" id="live">0</div>
      <div class="seek"><i id="seek"></i></div>
    </div>
  </div>

  <p class="score" id="score">?</p>
  <p class="sub" data-t="sub">TO BEAT · SAME COURSE · RACE THEIR GHOST</p>

  <a class="btn primary" id="open" href="toomuchfood://duel" data-t="open">Open in Too Much Food</a>
  <a class="btn install" id="get" href="https://apps.apple.com/app/id6749512460" data-t="get">Get the game — free</a>

  <p class="help" id="help" data-t-html="help">Don't have it? Tap <b>Get the game</b> — the challenge
    is waiting when you open it.</p>
</main>
<script src="/assets/js/duel.js"></script>
</body>
</html>
