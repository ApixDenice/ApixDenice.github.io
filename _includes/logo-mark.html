{%- assign uid = include.id | default: "m" -%}
<svg class="{{ include.class | default: 'brand-mark' }}" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="apx-bg-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262A35"/><stop offset="1" stop-color="#0B0C10"/></linearGradient>
    <linearGradient id="apx-rim-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="apx-px-{{ uid }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB224"/><stop offset=".5" stop-color="#FF4F6D"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
  </defs>
  {%- unless include.no_tile %}
  <rect width="256" height="256" rx="58" fill="url(#apx-bg-{{ uid }})"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#apx-rim-{{ uid }})" stroke-width="3"/>
  {%- endunless %}
  <path class="logo-apex" d="M74 200 L128 78 L182 200" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <rect class="logo-px" x="110" y="140" width="36" height="36" rx="7" fill="url(#apx-px-{{ uid }})"/>
</svg>
