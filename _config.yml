# Site settings
title: ApixDenice
description: DIPS & Office Mom — iOS & macOS apps for fitness and healthy habits
email: dennishasselbusch@icloud.com
baseurl: ""
url: "https://apixdenice.github.io"

# App Store links.
# The short /app/idNNNN form is storefront-neutral: Apple redirects each
# visitor to their own country's store automatically.
office_mom_ios_url: "https://apps.apple.com/app/id6760966448"
office_mom_mac_url: "https://apps.apple.com/app/id6757431484"

# Plugins (no remote theme — the site uses its own layout + stylesheet)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation (Home, Office Mom, Contact are simple links;
# DIPS is rendered as a dropdown in the layout)
navigation:
  - title: Home
    url: /
  - title: Office Mom
    url: /office-mom
  - title: Contact
    url: /contact

# Build settings
markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN_RECOMMENDATIONS.md
  - vendor
